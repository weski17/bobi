# Accepted findings of the demo image scan (`.github/workflows/image.yml`, Trivy, HIGH and CRITICAL with a fix).
#
# This is a baseline, not a verdict: on 2026-11-06 the scan reported these findings. They come from dependencies of
# the pinned engine (`vendor/opencode`: its npm packages, its build tools esbuild and tsgo) and from the Debian base
# image, none from Bobi's own code. Bobi does not change vendor code for this; they go away with the next engine or
# base image update. Reachability has NOT been analysed, so nothing here claims "not exploitable".
#
# Rules: a NEW finding fails the image workflow. Every entry expires; after that date the finding fails again until
# somebody re-checks it (update the engine/base image, or renew the entry with a reason). Do not add entries without
# looking at the finding. Process: docs/security/image-scan.md.
