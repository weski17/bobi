name: ci

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The engine and the COBOL test object; vendor/code-oss (~1 GB) is needed for the IDE build, not for these tests.
      - name: Checkout the engine and CardDemo submodules
        run: git submodule update --init --depth 1 vendor/opencode vendor/carddemo
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install ripgrep (OpenCode must not download it at runtime)
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install upstream
        run: cd vendor/opencode && bun install --frozen-lockfile
      - name: Install Bobi
        run: bun install --frozen-lockfile
      - name: Install headless Chromium
        run: bun run browser:install --with-deps
      - name: Dependency audit (known vulnerabilities, high and above fail the build)
        run: bun audit --audit-level=high
      - name: Typecheck
        run: bun run typecheck
      - name: Tests with coverage gate
        run: bun run test:coverage
      - name: End-to-end terminal UI (approval prompt)
        run: bun run test:e2e

  # Code tips as a check: a pull request must not add complexity warnings (complex functions, anti-patterns). Only what the
  # change adds counts; existing findings do not block. No model needed.
  tips:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout the engine submodule
        run: git submodule update --init --depth 1 vendor/opencode
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install upstream
        run: cd vendor/opencode && bun install --frozen-lockfile
      - name: Install Bobi
        run: bun install --frozen-lockfile
      - name: No new code-tip warnings in the changed files
        # The branch name goes through the environment, never into the script text (no injection through a branch name).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun packages/shell/src/cli.ts tips --since "origin/$BASE_REF" --fail-on warning

  redteam:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout the engine submodule
        run: git submodule update --init --depth 1 vendor/opencode
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install upstream
        run: cd vendor/opencode && bun install --frozen-lockfile
      - name: Install Bobi
        run: bun install --frozen-lockfile
      - name: Red team with promptfoo (compromised mock model)
        run: bun run test:redteam
